groups:
  - name: arn-service-alerts
    rules:
      - alert: ServiceHTTPDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
          project: ARN
        annotations:
          summary: "Service HTTP indisponible"
          description: "La cible {{ $labels.instance }} ne répond plus via Blackbox Exporter."